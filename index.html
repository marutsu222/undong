<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f7f5f0">
  <title>脱★運動不足トレーニング</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        sans-serif;
      background: #f7f5f0;
      color: #333;
    }

    .app {
      width: 100%;
      max-width: 520px;
      min-height: 100vh;
      margin: 0 auto;
      padding: 24px 20px 40px;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 25px;
      margin: 0;
      font-weight: 700;
    }

    /* =========================
       進捗
    ========================== */

    .progress-area {
      margin-bottom: 20px;
    }

    .progress-text {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: #888;
      margin-bottom: 8px;
    }

    .progress-bar {
      width: 100%;
      height: 8px;
      background: #e5e2dc;
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 14.28%;
      background: #777;
      border-radius: 999px;
      transition: width 0.4s ease;
    }

    /* =========================
       カード
    ========================== */

    .card {
      background: white;
      border-radius: 24px;
      padding: 30px 22px;
      text-align: center;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
    }


    /* =========================
       開始画面
    ========================== */

    .start-screen {
      text-align: center;
      padding: 45px 15px;
    }

    .start-screen h2 {
      font-size: 28px;
      margin: 0 0 18px;
      line-height: 1.5;
    }

    .start-screen p {
      color: #777;
      line-height: 1.8;
      margin: 0 0 28px;
    }

    .start-screen .start-button {
      width: 100%;
      max-width: 320px;
      margin: 0 auto;
    }

    /* =========================
       運動画像
    ========================== */

    .exercise-icon {
      width: 144px;
      height: 144px;
      margin: 8px auto 15px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .exercise-icon img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 20px;
      display: block;
    }

    .exercise-name {
      font-size: 26px;
      font-weight: 700;
      margin: 0 0 16px;
    }

    /* =========================
       説明・目標 横並び
    ========================== */

    .exercise-info {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
    }

    .description-toggle {
      display: inline-block;
      background: #eaf3ff;
      color: #174a7e;
      border: 2px solid #174a7e;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 700;
      padding: 12px 14px;
      margin: 0;
      white-space: nowrap;
    }

    .description-toggle:hover {
      background: #dcecff;
    }

    /* =========================
       詳細説明
    ========================== */

    .exercise-description {
      display: none;
      text-align: left;
      background: #faf9f6;
      border-radius: 14px;
      padding: 16px;
      margin: 0 auto 20px;
      max-width: 400px;
      color: #666;
      font-size: 14px;
      line-height: 1.8;
    }

    .exercise-description.open {
      display: block;
    }

    .exercise-description ol {
      margin: 0;
      padding-left: 22px;
    }

    .exercise-description li {
      margin-bottom: 5px;
    }

    .exercise-description li:last-child {
      margin-bottom: 0;
    }

    /* =========================
       目標
    ========================== */

    .target {
      display: inline-block;
      background: #d94a4a;
      color: white;
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 20px;
      font-weight: 700;
      margin: 0;
      min-width: 100px;
      white-space: nowrap;
    }

    /* =========================
       タイマー
    ========================== */

    .timer {
      font-size: 48px;
      font-weight: 700;
      letter-spacing: 0.03em;
      margin: 5px 0 12px;
      font-variant-numeric: tabular-nums;
    }

    /* =========================
       ボタン
    ========================== */

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    button {
      border: none;
      border-radius: 14px;
      padding: 15px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    button:active {
      transform: scale(0.98);
    }

    .start-button {
      background: #333;
      color: white;
    }

    .pause-button {
      background: #e8e5df;
      color: #444;
    }

    .repeat-button {
      background: #f1efea;
      color: #555;
    }

    /* =========================
       アドバイス
    ========================== */

    .tip {
      margin-top: 18px;
      padding: 14px;
      background: #faf9f6;
      border-radius: 12px;
      font-size: 13px;
      line-height: 1.7;
      color: #777;
      text-align: left;
    }

    /* =========================
       完了画面
    ========================== */

    .complete {
      text-align: center;
      padding: 50px 10px;
    }

    /* 完了画面のイラスト
       通常の運動画像より大きくする */

    .complete-icon {
      width: 180px;
      height: 180px;
      margin: 0 auto 15px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .complete-icon img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 20px;
    }

    .complete h2 {
      font-size: 30px;
      margin: 0 0 15px;
    }

    .complete p {
      color: #777;
      line-height: 1.8;
      margin-bottom: 30px;
    }

    .total-time {
      display: inline-block;
      background: #f3f1ec;
      padding: 12px 20px;
      border-radius: 999px;
      margin-bottom: 25px;
      font-size: 14px;
    }

    /* =========================
       スマホ
    ========================== */

    @media (max-width: 380px) {

      .app {
        padding: 18px 14px 30px;
      }

      .card {
        padding: 24px 17px;
      }

      .exercise-icon {
        width: 128px;
        height: 128px;
      }

      .exercise-name {
        font-size: 23px;
      }

      .timer {
        font-size: 42px;
      }

      .exercise-info {
        gap: 7px;
      }

      .description-toggle,
      .target {
        font-size: 13px;
        padding: 11px 10px;
      }

      .target {
        min-width: 90px;
      }

      .complete-icon {
        width: 180px;
        height: 180px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <header>
    <h1>🌱 脱★運動不足トレーニング</h1>
  </header>


  <!-- =========================
       トレーニング画面
  ========================== -->

  <!-- =========================
       最初のスタート画面
  ========================== -->

  <div id="startScreen">

    <div class="card start-screen">

      <h2>今日も一緒に<br>頑張ろう！</h2>

      <p>
        これから6種目を続けて行います。<br>
        各種目は1分間です。<br>
        音が鳴ったら自動で次の種目へ進みます。
      </p>

      <button
        class="start-button"
        onclick="startWorkout()">
        ▶ トレーニングスタート
      </button>

    </div>

  </div>


  <!-- =========================
       トレーニング画面
  ========================== -->

  <div id="workoutScreen" style="display:none;">

    <div class="progress-area">

      <div class="progress-text">
        <span id="progressText">1 / 6</span>
        <span id="progressPercent">17%</span>
      </div>

      <div class="progress-bar">
        <div
          class="progress-fill"
          id="progressFill">
        </div>
      </div>

    </div>


    <div class="card">

      <!-- 運動画像 -->

      <div class="exercise-icon">
        <img
          id="exerciseImage"
          src="https://marutsu222.github.io/undong/image/ashibumi.png"
          alt="その場で足踏み">
      </div>


      <h2
        class="exercise-name"
        id="exerciseName">
        その場で足踏み
      </h2>


      <!-- 説明と目標 -->

      <div class="exercise-info">

        <button
          class="description-toggle"
          id="descriptionToggle"
          onclick="toggleDescription()">
          説明を見る ▼
        </button>

        <div
          class="target"
          id="exerciseTarget">
          1分
        </div>

      </div>


      <!-- 詳細説明 -->

      <div
        class="exercise-description"
        id="exerciseDescription">
      </div>


      <!-- タイマー -->

      <div
        class="timer"
        id="timer">
        00:00
      </div>


      <!-- 一時停止・やり直す -->

      <div class="buttons">

        <button
          class="pause-button"
          id="pauseButton"
          onclick="togglePause()">
          ⏸ 一時停止
        </button>

        <button
          class="repeat-button"
          id="repeatButton"
          onclick="resetExercise()">
          🔄 やり直す
        </button>

      </div>


      <!-- アドバイス -->

      <div
        class="tip"
        id="exerciseTip">
        💡 「その場で歩く」くらいの感覚で大丈夫！
      </div>

    </div>

  </div>


  <!-- =========================
       完了画面
  ========================== -->

  <div
    id="completeScreen"
    style="display:none;">

    <div class="card complete">

      <!-- 完了イラスト -->

      <div class="complete-icon">
        <img
          src="https://marutsu222.github.io/undong/image/complete.png"
          alt="トレーニング完了">
      </div>


      <h2>
        お疲れ様でした！
      </h2>


      <p>
        今日のトレーニング、<br>
        しっかり最後までできました！<br><br>
        「できた自分」を褒めよう🌱
      </p>


      <div class="total-time">
        ⏱ 今日のトータル時間：
        <strong id="totalTime">
          00:00
        </strong>
      </div>


      <button
        class="start-button"
        onclick="restartWorkout()">
        最初から始める
      </button>

    </div>

  </div>

</div>


<script>

  /* =========================
     トレーニングメニュー
  ========================== */

  const exercises = [

    /* 1. その場で足踏み */

    {
      image:
        "https://marutsu222.github.io/undong/image/ashibumi.png",

      name: "その場で足踏み",

      description: [
        "背筋を軽く伸ばして立つ。",
        "右足・左足と交互に、その場で足踏みする。",
        "腕も自然に前後へ振る。",
      ],

      target: "1分",

      

      targetSeconds: 60,tip:
        "💡 「その場で歩く」くらいの感覚で大丈夫！",

      targetSeconds: 60
    },


    /* 2. スクワット */

    {
      image:
        "https://marutsu222.github.io/undong/image/squat.png",

      name: "スクワット",

      description: [
        "足を肩幅くらいに開いて立つ。",
        "つま先は少し外側に向ける。",
        "お尻を後ろに引くように、ゆっくり腰を下ろす。",
        "ゆっくり立ち上がる。",
      ],

      target: "1分",

      

      targetSeconds: 60,tip:
        "💡 膝がつま先より極端に前へ出ないように。浅めのスクワットから始めてもOK！",
},


    /* 3. 壁腕立て */

    {
      image:
        "https://marutsu222.github.io/undong/image/kabeudetate.png",

      name: "壁腕立て",

      description: [
        "両手を肩幅くらいに開き、垂直に壁に手をつく。",
        "背筋を伸ばし、肘を曲げて胸を壁に近づける。",
        "壁を押して、元の姿勢に戻る。",
      ],

      target: "1分",

      

      targetSeconds: 60,tip:
        "💡 床でやるよりお手軽♪ 肩甲骨が開くことを意識。",
},


    /* 4. ヒップリフト */

    {
      image:
        "https://marutsu222.github.io/undong/image/hip-lift.png",

      name: "ヒップリフト",

      description: [
        "仰向けになり、床に対し90度で足を立て、腰幅くらいに開く。",
        "お尻をキュッと締めながら、ゆっくり持ち上げる。",
        "膝から肩まで一直線にさせ、一度止まり、お尻を下ろす。",
      ],

      target: "1分",

      

      targetSeconds: 60,tip:
        "💡 腰を上げすぎて反らすのではなく、「お尻で持ち上げる」イメージ。",
},


    /* 5. かかと上げ */

    {
      image:
        "https://marutsu222.github.io/undong/image/kakatoage.png",

      name: "かかと上げ",

      description: [
        "まっすぐ立ち、足を肩幅くらいに開く。",
        "かかとをゆっくり持ち上げ、つま先立ちで少し止める。",
        "ゆっくりかかとを下ろす。",
      ],

      target: "1分",

      

      targetSeconds: 60,tip:
        "💡 ふらつく場合は、壁や机につかまってOK。",
},


    /* 6. その場で足踏み */

    {
      image:
        "https://marutsu222.github.io/undong/image/ashibumi.png",

      name: "その場で足踏み",

      description: [
        "背筋を軽く伸ばして立つ。",
        "右足・左足と交互に、その場で足踏みする。",
        "腕も自然に前後へ振る。",
      ],

      target: "1分",

      

      targetSeconds: 60,tip:
        "💡 「その場で歩く」くらいの感覚で大丈夫！",

      targetSeconds: 60
    },

  ];


  /* =========================
     状態
  ========================== */

  let currentExercise = 0;
  let seconds = 0;
  let totalSeconds = 0;
  let timerInterval = null;
  let isRunning = false;
  let isPaused = false;


  /* =========================
     現在の種目
  ========================== */

  function getCurrentExercise() {
    return exercises[currentExercise];
  }


  /* =========================
     説明の開閉
  ========================== */

  function toggleDescription() {

    const description =
      document.getElementById("exerciseDescription");

    const button =
      document.getElementById("descriptionToggle");

    const isOpen =
      description.classList.contains("open");


    if (isOpen) {

      description.classList.remove("open");

      button.textContent =
        "説明を見る ▼";

    } else {

      description.classList.add("open");

      button.textContent =
        "閉じる ▲";
    }
  }


  /* =========================
     説明を更新
  ========================== */

  function updateDescription(exercise) {

    const description =
      document.getElementById("exerciseDescription");


    description.innerHTML =
      `<ol>
        ${exercise.description
          .map(text => `<li>${text}</li>`)
          .join("")}
      </ol>`;


    description.classList.remove("open");


    document.getElementById("descriptionToggle").textContent =
      "説明を見る ▼";
  }


  /* =========================
     画面更新
  ========================== */

  function updateScreen() {

    const exercise =
      getCurrentExercise();


    document.getElementById("exerciseImage").src =
      exercise.image;

    document.getElementById("exerciseImage").alt =
      exercise.name;


    document.getElementById("exerciseName").textContent =
      exercise.name;


    document.getElementById("exerciseTarget").textContent =
      exercise.target;


    document.getElementById("exerciseTip").textContent =
      exercise.tip;


    updateDescription(exercise);


    document.getElementById("progressText").textContent =
      `${currentExercise + 1} / ${exercises.length}`;


    const percent =
      Math.round(
        ((currentExercise + 1) / exercises.length) * 100
      );


    document.getElementById("progressPercent").textContent =
      `${percent}%`;


    document.getElementById("progressFill").style.width =
      `${percent}%`;


    updateTimerDisplay();

    updatePauseButton();
  }


  /* =========================
     一時停止ボタン表示
  ========================== */

  function updatePauseButton() {

    const pauseButton =
      document.getElementById("pauseButton");

    pauseButton.textContent =
      isPaused
        ? "▶ 再開"
        : "⏸ 一時停止";
  }


  /* =========================
     開始
  ========================== */

  function startWorkout() {

    document.getElementById("startScreen").style.display =
      "none";

    document.getElementById("workoutScreen").style.display =
      "block";

    currentExercise = 0;
    seconds = 0;
    totalSeconds = 0;
    isRunning = false;
    isPaused = false;

    updateScreen();

    // ユーザーのスタート操作後に音声を有効化
    prepareAudio();

    startTimer();
  }


  /* =========================
     タイマー開始
  ========================== */

  function startTimer() {

    if (isRunning) {
      return;
    }

    isRunning = true;
    isPaused = false;

    updatePauseButton();


    timerInterval =
      setInterval(() => {

        seconds++;
        totalSeconds++;

        updateTimerDisplay();


        const exercise =
          getCurrentExercise();


        if (
          seconds >= exercise.targetSeconds
        ) {

          clearInterval(timerInterval);

          timerInterval = null;

          isRunning = false;
          isPaused = false;

          playTransitionSound();

          if (currentExercise === exercises.length - 1) {

            showComplete();

            return;
          }


          currentExercise++;

          seconds = 0;

          updateScreen();

          // 次の種目をすぐに開始
          startTimer();
        }

      }, 1000);
  }


  /* =========================
     一時停止・再開
  ========================== */

  function togglePause() {

    if (isRunning) {

      clearInterval(timerInterval);

      timerInterval = null;

      isRunning = false;

      isPaused = true;

      updatePauseButton();

      return;
    }


    if (isPaused) {

      isPaused = false;

      startTimer();
    }
  }


  /* =========================
     現在の種目をやり直す
  ========================== */

  function resetExercise() {

    clearInterval(timerInterval);

    timerInterval = null;

    seconds = 0;

    isRunning = false;

    isPaused = false;

    updateTimerDisplay();

    updatePauseButton();

    // やり直しを押したら、その種目を最初から開始
    startTimer();
  }


  /* =========================
     タイマー表示
  ========================== */

  function updateTimerDisplay() {

    const minutes =
      Math.floor(seconds / 60);


    const remainingSeconds =
      seconds % 60;


    document.getElementById("timer").textContent =
      `${String(minutes).padStart(2, "0")}:${String(remainingSeconds).padStart(2, "0")}`;
  }


  /* =========================
     音
  ========================== */

function playTransitionSound() {
  const sound = new Audio(
    "https://marutsu222.github.io/undong/sound/next.mp3"
  );

  sound.play();
}

  /* =========================
     完了画面
  ========================== */

  function showComplete() {

    clearInterval(timerInterval);

    timerInterval = null;

    isRunning = false;
    isPaused = false;


    document.getElementById("workoutScreen").style.display =
      "none";


    document.getElementById("completeScreen").style.display =
      "block";


    document.getElementById("totalTime").textContent =
      formatTime(totalSeconds);
  }


  /* =========================
     最初から
  ========================== */

  function restartWorkout() {

    clearInterval(timerInterval);

    timerInterval = null;

    isRunning = false;
    isPaused = false;

    currentExercise = 0;
    seconds = 0;
    totalSeconds = 0;


    document.getElementById("completeScreen").style.display =
      "none";

    document.getElementById("workoutScreen").style.display =
      "none";

    document.getElementById("startScreen").style.display =
      "block";

    updateTimerDisplay();
  }


  /* =========================
     時間フォーマット
  ========================== */

  function formatTime(totalSeconds) {

    const minutes =
      Math.floor(totalSeconds / 60);


    const seconds =
      totalSeconds % 60;


    return `${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}`;
  }


  /* =========================
     初期表示
  ========================== */

  updateTimerDisplay();

</script>

</body>
</html>
