<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f7f5f0">
  <title>脱★運動不足トレーニング</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        sans-serif;
      background: #f7f5f0;
      color: #333;
    }

    .app {
      width: 100%;
      max-width: 520px;
      min-height: 100vh;
      margin: 0 auto;
      padding: 24px 20px 40px;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 25px;
      margin: 0;
      font-weight: 700;
    }

    /* =========================
       進捗
    ========================== */

    .progress-area {
      margin-bottom: 20px;
    }

    .progress-text {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: #888;
      margin-bottom: 8px;
    }

    .progress-bar {
      width: 100%;
      height: 8px;
      background: #e5e2dc;
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 14.28%;
      background: #777;
      border-radius: 999px;
      transition: width 0.4s ease;
    }

    /* =========================
       カード
    ========================== */

    .card {
      background: white;
      border-radius: 24px;
      padding: 30px 22px;
      text-align: center;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
    }

    /* =========================
       運動画像
    ========================== */

    .exercise-icon {
      width: 180px;
      height: 180px;
      margin: 8px auto 15px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .exercise-icon img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 20px;
      display: block;
    }

    .exercise-name {
      font-size: 26px;
      font-weight: 700;
      margin: 0 0 18px;
    }

    /* =========================
       説明
    ========================== */

    .description-toggle {
      display: inline-block;
      background: transparent;
      color: #777;
      font-size: 14px;
      font-weight: 600;
      padding: 8px 4px;
      margin-bottom: 8px;
    }

    .description-toggle:hover {
      opacity: 0.7;
    }

    .exercise-description {
      display: none;
      text-align: left;
      background: #faf9f6;
      border-radius: 14px;
      padding: 16px;
      margin: 0 auto 20px;
      max-width: 400px;
      color: #666;
      font-size: 14px;
      line-height: 1.8;
    }

    .exercise-description.open {
      display: block;
    }

    .exercise-description ol {
      margin: 0;
      padding-left: 22px;
    }

    .exercise-description li {
      margin-bottom: 5px;
    }

    .exercise-description li:last-child {
      margin-bottom: 0;
    }

    /* =========================
       目標
    ========================== */

    .target {
      display: block;
      background: #d94a4a;
      color: white;
      border-radius: 14px;
      padding: 14px 18px;
      font-size: 20px;
      font-weight: 700;
      margin: 8px auto 22px;
      max-width: 120px;
    }

    /* =========================
       タイマー
    ========================== */

    .timer {
      font-size: 48px;
      font-weight: 700;
      letter-spacing: 0.03em;
      margin: 5px 0 12px;
      font-variant-numeric: tabular-nums;
    }

    .timer-status {
      min-height: 22px;
      font-size: 14px;
      margin-bottom: 15px;
      color: #999;
    }

    .timer-status.complete {
      color: #555;
      font-weight: 700;
    }

    /* =========================
       回数達成ボタン
    ========================== */

    .rep-complete-button {
      width: 100%;
      background: #333;
      color: white;
      font-size: 18px;
      padding: 17px;
      margin-bottom: 10px;
    }

    /* =========================
       ボタン
    ========================== */

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    button {
      border: none;
      border-radius: 14px;
      padding: 15px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    button:active {
      transform: scale(0.98);
    }

    .start-button {
      background: #333;
      color: white;
    }

    .pause-button {
      background: #e8e5df;
      color: #444;
    }

    .repeat-button {
      background: #f1efea;
      color: #555;
    }

    .next-button {
      background: #333;
      color: white;
    }

    .back-button {
      background: transparent;
      color: #999;
      font-size: 13px;
      padding: 10px;
    }

    /* =========================
       アドバイス
    ========================== */

    .tip {
      margin-top: 18px;
      padding: 14px;
      background: #faf9f6;
      border-radius: 12px;
      font-size: 13px;
      line-height: 1.7;
      color: #777;
      text-align: left;
    }

    /* =========================
       完了画面
    ========================== */

    .complete {
      text-align: center;
      padding: 50px 10px;
    }

    .complete-icon {
      font-size: 70px;
      margin-bottom: 15px;
    }

    .complete h2 {
      font-size: 30px;
      margin: 0 0 15px;
    }

    .complete p {
      color: #777;
      line-height: 1.8;
      margin-bottom: 30px;
    }

    .total-time {
      display: inline-block;
      background: #f3f1ec;
      padding: 12px 20px;
      border-radius: 999px;
      margin-bottom: 25px;
      font-size: 14px;
    }

    /* =========================
       スマホ
    ========================== */

    @media (max-width: 380px) {

      .app {
        padding: 18px 14px 30px;
      }

      .card {
        padding: 24px 17px;
      }

      .exercise-icon {
        width: 160px;
        height: 160px;
      }

      .exercise-name {
        font-size: 23px;
      }

      .timer {
        font-size: 42px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <header>
    <h1>🌱 脱★運動不足トレーニング</h1>
  </header>


  <!-- =========================
       トレーニング画面
  ========================== -->

  <div id="workoutScreen">

    <div class="progress-area">

      <div class="progress-text">
        <span id="progressText">1 / 7</span>
        <span id="progressPercent">14%</span>
      </div>

      <div class="progress-bar">
        <div
          class="progress-fill"
          id="progressFill">
        </div>
      </div>

    </div>


    <div class="card">

      <!-- 運動画像 -->

      <div class="exercise-icon">
        <img
          id="exerciseImage"
          src="https://marutsu222.github.io/undong/image/ashibumi.png"
          alt="その場で足踏み">
      </div>


      <h2
        class="exercise-name"
        id="exerciseName">
        その場で足踏み
      </h2>


      <!-- 説明を見る -->

      <button
        class="description-toggle"
        id="descriptionToggle"
        onclick="toggleDescription()">
        説明を見る ▼
      </button>


      <!-- 詳細説明 -->

      <div
        class="exercise-description"
        id="exerciseDescription">
      </div>


      <!-- 目標 -->

      <div
        class="target"
        id="exerciseTarget">
        ⏱ 1分
      </div>


      <!-- タイマー -->

      <div
        class="timer"
        id="timer">
        00:00
      </div>


      <div
        class="timer-status"
        id="timerStatus">
        準備ができたらスタート！
      </div>


      <!-- 回数系専用 -->

      <button
        class="rep-complete-button"
        id="repCompleteButton"
        onclick="completeReps()"
        style="display:none;">
        ✓ 10回達成
      </button>


      <div class="buttons">

        <!-- スタート -->

        <button
          class="start-button"
          id="startButton"
          onclick="startTimer()">
          ▶ スタート
        </button>


        <!-- 一時停止 -->

        <button
          class="pause-button"
          id="pauseButton"
          onclick="togglePause()"
          style="display:none;">
          ⏸ 一時停止
        </button>


        <!-- もう一度 -->

        <button
          class="repeat-button"
          id="repeatButton"
          onclick="resetExercise()"
          style="display:none;">
          🔄 もう一度やる
        </button>


        <!-- 次へ -->

        <button
          class="next-button"
          id="nextButton"
          onclick="nextExercise()"
          style="display:none;">
          次の種目へ →
        </button>


        <!-- 前へ -->

        <button
          class="back-button"
          id="backButton"
          onclick="previousExercise()"
          style="display:none;">
          ← 前の種目に戻る
        </button>

      </div>


      <!-- アドバイス -->

      <div
        class="tip"
        id="exerciseTip">
        💡 「その場で歩く」くらいの感覚で大丈夫！
      </div>

    </div>

  </div>


  <!-- =========================
       完了画面
  ========================== -->

  <div
    id="completeScreen"
    style="display:none;">

    <div class="card complete">

      <div class="complete-icon">
        🎉
      </div>

      <h2>
        お疲れ様でした！
      </h2>

      <p>
        今日のトレーニング、<br>
        しっかり最後までできました！<br><br>
        まずは「やった自分」を褒めよう🌱
      </p>

      <div class="total-time">
        ⏱ 今日のトータル時間：
        <strong id="totalTime">
          00:00
        </strong>
      </div>

      <button
        class="start-button"
        onclick="restartWorkout()">
        🔄 もう一度やる
      </button>

    </div>

  </div>

</div>


<script>

  /* =========================
     トレーニングメニュー
  ========================== */

  const exercises = [

    /* 1. その場で足踏み */

    {
      type: "time",

      image:
        "https://marutsu222.github.io/undong/image/ashibumi.png",

      name: "その場で足踏み",

      description: [
        "背筋を軽く伸ばして立つ。",
        "右足・左足と交互に、その場で足踏みする。",
        "腕も自然に前後へ振る。",
        "無理に膝を高く上げる必要はありません。"
      ],

      target: "⏱ 1分",

      tip:
        "💡 「その場で歩く」くらいの感覚で大丈夫！",

      targetSeconds: 60
    },


    /* 2. スクワット */

    {
      type: "reps",

      image:
        "https://marutsu222.github.io/undong/image/squat.png",

      name: "スクワット",

      description: [
        "足を肩幅くらいに開いて立つ。",
        "つま先は少し外側に向ける。",
        "お尻を後ろに引くように、ゆっくり腰を下ろす。",
        "膝がつま先より極端に前へ出ないようにする。",
        "無理に深くしゃがむ必要はありません。",
        "ゆっくり立ち上がる。",
        "これを10回行う。"
      ],

      target: "🔢 10回",

      tip:
        "💡 「椅子に座る」イメージで。浅めのスクワットから始めてもOK！",

      targetReps: 10
    },


    /* 3. 壁腕立て */

    {
      type: "reps",

      image:
        "https://marutsu222.github.io/undong/image/kabeudetate.png",

      name: "壁腕立て",

      description: [
        "壁から少し離れて立つ。",
        "両手を肩幅くらいに開いて壁につく。",
        "体を頭から足までなるべく一直線にする。",
        "肘をゆっくり曲げて、胸を壁に近づける。",
        "壁を押して、ゆっくり元の姿勢に戻る。",
        "これを10回行う。"
      ],

      target: "🔢 10回",

      tip:
        "💡 床でやる腕立て伏せよりずっと簡単です。体を一直線に保つことを意識しましょう。",

      targetReps: 10
    },


    /* 4. ヒップリフト */

    {
      type: "reps",

      image:
        "https://marutsu222.github.io/undong/image/hip-lift.png",

      name: "ヒップリフト",

      description: [
        "仰向けになり、膝を曲げる。",
        "足を腰幅くらいに開き、足の裏を床につける。",
        "お腹に軽く力を入れる。",
        "お尻をキュッと締めながら、ゆっくり持ち上げる。",
        "肩から膝までがなだらかな一直線になるところまで上げる。",
        "腰を反らしすぎないようにする。",
        "一度止まり、ゆっくりお尻を下ろす。",
        "これを10回行う。"
      ],

      target: "🔢 10回",

      tip:
        "💡 腰を反らすのではなく、「お尻で持ち上げる」イメージです。",

      targetReps: 10
    },


    /* 5. かかと上げ */

    {
      type: "reps",

      image:
        "https://marutsu222.github.io/undong/image/kakatoage.png",

      name: "かかと上げ",

      description: [
        "まっすぐ立ち、足を肩幅くらいに開く。",
        "必要なら壁や机に手をつく。",
        "両方のかかとをゆっくり持ち上げる。",
        "つま先立ちになったところで少し止める。",
        "ゆっくりかかとを下ろす。",
        "反動を使わず、ゆっくり繰り返す。",
        "これを15回行う。"
      ],

      target: "🔢 15回",

      tip:
        "💡 ふらつく場合は、壁や机につかまってOKです。",

      targetReps: 15
    },


    /* 6. その場で足踏み */

    {
      type: "time",

      image:
        "https://marutsu222.github.io/undong/image/ashibumi.png",

      name: "その場で足踏み",

      description: [
        "背筋を軽く伸ばして立つ。",
        "右足・左足と交互に、その場で足踏みする。",
        "最初の足踏みより少しだけ元気よく動く。",
        "腕もしっかり前後に振る。",
        "息が苦しくならない範囲で行う。"
      ],

      target: "⏱ 1分",

      tip:
        "💡 「ちょっと心拍数が上がったな」くらいでOK。頑張りすぎなくて大丈夫！",

      targetSeconds: 60
    },


    /* 7. 軽くストレッチ */

    {
      type: "time",

      image:
        "https://marutsu222.github.io/undong/image/stretch.png",

      name: "軽くストレッチ",

      description: [
        "ふくらはぎをゆっくり伸ばす。",
        "太ももの前をゆっくり伸ばす。",
        "胸や肩をゆっくり開く。",
        "反動をつけず、ゆっくり呼吸する。",
        "痛みを感じるところまで無理に伸ばさない。"
      ],

      target: "⏱ 1〜2分",

      tip:
        "💡 「痛い」ではなく「気持ちいい」と感じるところで止めましょう。",

      targetSeconds: 90
    }

  ];


  /* =========================
     状態
  ========================== */

  let currentExercise = 0;

  let seconds = 0;

  let totalSeconds = 0;

  let timerInterval = null;

  let isRunning = false;

  let isPaused = false;

  let completed = false;


  /* =========================
     現在の種目
  ========================== */

  function getCurrentExercise() {
    return exercises[currentExercise];
  }


  /* =========================
     説明の開閉
  ========================== */

  function toggleDescription() {

    const description =
      document.getElementById("exerciseDescription");

    const button =
      document.getElementById("descriptionToggle");

    const isOpen =
      description.classList.contains("open");


    if (isOpen) {

      description.classList.remove("open");

      button.textContent =
        "説明を見る ▼";

    } else {

      description.classList.add("open");

      button.textContent =
        "説明を閉じる ▲";
    }
  }


  /* =========================
     説明を更新
  ========================== */

  function updateDescription(exercise) {

    const description =
      document.getElementById("exerciseDescription");


    description.innerHTML =
      `<ol>
        ${exercise.description
          .map(text => `<li>${text}</li>`)
          .join("")}
      </ol>`;


    description.classList.remove("open");


    document.getElementById("descriptionToggle").textContent =
      "説明を見る ▼";
  }


  /* =========================
     画面更新
  ========================== */

  function updateScreen() {

    const exercise =
      getCurrentExercise();


    /* 画像 */

    const image =
      document.getElementById("exerciseImage");

    image.src =
      exercise.image;

    image.alt =
      exercise.name;


    /* 種目名 */

    document.getElementById("exerciseName").textContent =
      exercise.name;


    /* 目標 */

    document.getElementById("exerciseTarget").textContent =
      exercise.target;


    /* アドバイス */

    document.getElementById("exerciseTip").textContent =
      exercise.tip;


    /* 説明 */

    updateDescription(exercise);


    /* 進捗 */

    document.getElementById("progressText").textContent =
      `${currentExercise + 1} / ${exercises.length}`;


    const percent =
      Math.round(
        ((currentExercise + 1) / exercises.length) * 100
      );


    document.getElementById("progressPercent").textContent =
      `${percent}%`;


    document.getElementById("progressFill").style.width =
      `${percent}%`;


    updateTimerDisplay();

    updateButtons();
  }


  /* =========================
     ボタン表示
  ========================== */

  function updateButtons() {

    const exercise =
      getCurrentExercise();


    const targetReached =
      completed;


    const startButton =
      document.getElementById("startButton");

    const pauseButton =
      document.getElementById("pauseButton");

    const repeatButton =
      document.getElementById("repeatButton");

    const nextButton =
      document.getElementById("nextButton");

    const repCompleteButton =
      document.getElementById("repCompleteButton");


    /* スタート */

    startButton.style.display =
      (
        !isRunning &&
        !isPaused &&
        seconds === 0 &&
        !completed
      )
      ? "block"
      : "none";


    /* 一時停止 */

    pauseButton.style.display =
      (
        isRunning ||
        isPaused
      ) && !completed
      ? "block"
      : "none";


    pauseButton.textContent =
      isPaused
      ? "▶ 再開"
      : "⏸ 一時停止";


    /* 回数達成ボタン */

    repCompleteButton.style.display =
      exercise.type === "reps" &&
      !completed &&
      (isRunning || isPaused)
      ? "block"
      : "none";


    /* 回数達成ボタンを種目ごとに変更 */

    if (exercise.type === "reps") {

      repCompleteButton.textContent =
        `✓ ${exercise.targetReps}回達成`;
    }


    /* 目標達成後 */

    repeatButton.style.display =
      targetReached
      ? "block"
      : "none";


    nextButton.style.display =
      targetReached
      ? "block"
      : "none";


    /* 前へ */

    document.getElementById("backButton").style.display =
      currentExercise > 0
      ? "block"
      : "none";


    /* ステータス */

    const status =
      document.getElementById("timerStatus");


    if (completed) {

      if (exercise.type === "time") {

        status.textContent =
          "🎉 目標時間達成！";

      } else {

        status.textContent =
          `🎉 ${exercise.targetReps}回達成！`;
      }


      status.className =
        "timer-status complete";


    } else if (isPaused) {

      status.textContent =
        "⏸ 一時停止中";

      status.className =
        "timer-status";


    } else if (isRunning) {

      if (exercise.type === "time") {

        status.textContent =
          "そのまま続けよう！";

      } else {

        status.textContent =
          `${exercise.targetReps}回できたら「${exercise.targetReps}回達成」を押そう！`;
      }


      status.className =
        "timer-status";


    } else {

      status.textContent =
        "準備ができたらスタート！";

      status.className =
        "timer-status";
    }

  }


  /* =========================
     タイマー開始
  ========================== */

  function startTimer() {

    if (isRunning || completed) {
      return;
    }


    isRunning = true;

    isPaused = false;


    timerInterval =
      setInterval(() => {

        seconds++;

        totalSeconds++;

        updateTimerDisplay();


        const exercise =
          getCurrentExercise();


        /* 時間系は目標時間で自動終了 */

        if (
          exercise.type === "time" &&
          seconds >= exercise.targetSeconds
        ) {

          clearInterval(timerInterval);

          timerInterval = null;

          isRunning = false;

          isPaused = false;

          completed = true;
        }


        updateButtons();

      }, 1000);


    updateScreen();
  }


  /* =========================
     一時停止・再開
  ========================== */

  function togglePause() {

    if (completed) {
      return;
    }


    if (isRunning) {

      clearInterval(timerInterval);

      timerInterval = null;

      isRunning = false;

      isPaused = true;


    } else if (isPaused) {

      isPaused = false;

      isRunning = true;


      timerInterval =
        setInterval(() => {

          seconds++;

          totalSeconds++;

          updateTimerDisplay();


          const exercise =
            getCurrentExercise();


          if (
            exercise.type === "time" &&
            seconds >= exercise.targetSeconds
          ) {

            clearInterval(timerInterval);

            timerInterval = null;

            isRunning = false;

            isPaused = false;

            completed = true;
          }


          updateButtons();

        }, 1000);
    }


    updateScreen();
  }


  /* =========================
     回数達成
  ========================== */

  function completeReps() {

    const exercise =
      getCurrentExercise();


    if (exercise.type !== "reps") {
      return;
    }


    if (completed) {
      return;
    }


    clearInterval(timerInterval);

    timerInterval = null;

    isRunning = false;

    isPaused = false;

    completed = true;


    updateButtons();
  }


  /* =========================
     種目をリセット
  ========================== */

  function resetExercise() {

    clearInterval(timerInterval);

    timerInterval = null;

    isRunning = false;

    isPaused = false;

    seconds = 0;

    completed = false;


    updateScreen();
  }


  /* =========================
     次の種目
  ========================== */

  function nextExercise() {

    if (!completed) {
      return;
    }


    clearInterval(timerInterval);

    timerInterval = null;

    isRunning = false;

    isPaused = false;


    if (currentExercise === exercises.length - 1) {

      showComplete();

      return;
    }


    currentExercise++;

    seconds = 0;

    completed = false;


    updateScreen();
  }


  /* =========================
     前の種目
  ========================== */

  function previousExercise() {

    clearInterval(timerInterval);

    timerInterval = null;

    isRunning = false;

    isPaused = false;


    currentExercise =
      Math.max(
        0,
        currentExercise - 1
      );


    seconds = 0;

    completed = false;


    updateScreen();
  }


  /* =========================
     タイマー表示
  ========================== */

  function updateTimerDisplay() {

    const minutes =
      Math.floor(seconds / 60);


    const remainingSeconds =
      seconds % 60;


    document.getElementById("timer").textContent =
      `${String(minutes).padStart(2, "0")}:${String(remainingSeconds).padStart(2, "0")}`;
  }


  /* =========================
     完了画面
  ========================== */

  function showComplete() {

    clearInterval(timerInterval);

    timerInterval = null;

    isRunning = false;

    isPaused = false;


    document.getElementById("workoutScreen").style.display =
      "none";


    document.getElementById("completeScreen").style.display =
      "block";


    document.getElementById("totalTime").textContent =
      formatTime(totalSeconds);
  }


  /* =========================
     最初から
  ========================== */

  function restartWorkout() {

    clearInterval(timerInterval);

    timerInterval = null;

    isRunning = false;

    isPaused = false;

    currentExercise = 0;

    seconds = 0;

    totalSeconds = 0;

    completed = false;


    document.getElementById("workoutScreen").style.display =
      "block";


    document.getElementById("completeScreen").style.display =
      "none";


    updateScreen();
  }


  /* =========================
     時間フォーマット
  ========================== */

  function formatTime(totalSeconds) {

    const minutes =
      Math.floor(totalSeconds / 60);


    const seconds =
      totalSeconds % 60;


    return `${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}`;
  }


  /* =========================
     初期表示
  ========================== */

  updateScreen();

</script>

</body>
