```html
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f7f5f0">
  <title>5分トレーニング</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        sans-serif;
      background: #f7f5f0;
      color: #333;
    }

    .app {
      width: 100%;
      max-width: 520px;
      min-height: 100vh;
      margin: 0 auto;
      padding: 24px 20px 40px;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    .app-title {
      font-size: 14px;
      letter-spacing: 0.15em;
      color: #888;
      margin-bottom: 5px;
    }

    h1 {
      font-size: 25px;
      margin: 0;
      font-weight: 700;
    }

    /* =========================
       進捗
    ========================== */

    .progress-area {
      margin-bottom: 20px;
    }

    .progress-text {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: #888;
      margin-bottom: 8px;
    }

    .progress-bar {
      width: 100%;
      height: 8px;
      background: #e5e2dc;
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 14.28%;
      background: #777;
      border-radius: 999px;
      transition: width 0.4s ease;
    }

    /* =========================
       カード
    ========================== */

    .card {
      background: white;
      border-radius: 24px;
      padding: 30px 22px;
      text-align: center;
      box-shadow: 0 8px 30px rgba(0,0,0,0.06);
    }

    .step-label {
      font-size: 13px;
      color: #999;
      margin-bottom: 10px;
    }

    .exercise-icon {
      font-size: 58px;
      margin: 8px 0 15px;
    }

    .exercise-name {
      font-size: 26px;
      font-weight: 700;
      margin: 0 0 12px;
    }

    .exercise-description {
      font-size: 15px;
      line-height: 1.8;
      color: #666;
      margin: 0 auto 22px;
      max-width: 390px;
    }

    .target {
      display: inline-block;
      background: #f3f1ec;
      border-radius: 999px;
      padding: 8px 18px;
      font-size: 14px;
      color: #666;
      margin-bottom: 20px;
    }

    /* =========================
       タイマー
    ========================== */

    .timer-label {
      font-size: 12px;
      color: #aaa;
      margin-bottom: 4px;
    }

    .timer {
      font-size: 48px;
      font-weight: 700;
      letter-spacing: 0.03em;
      margin: 5px 0 12px;
      font-variant-numeric: tabular-nums;
    }

    .timer-status {
      min-height: 22px;
      font-size: 14px;
      margin-bottom: 15px;
      color: #999;
    }

    .timer-status.complete {
      color: #555;
      font-weight: 700;
    }

    /* =========================
       回数カウンター
    ========================== */

    .rep-counter {
      margin: 10px 0 20px;
    }

    .rep-number {
      font-size: 56px;
      font-weight: 700;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .rep-target {
      margin-top: 8px;
      color: #999;
      font-size: 14px;
    }

    .count-button {
      width: 100%;
      background: #333;
      color: white;
      font-size: 20px;
      padding: 18px;
      margin-bottom: 10px;
    }

    .count-button:disabled {
      opacity: 0.35;
    }

    /* =========================
       ボタン
    ========================== */

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    button {
      border: none;
      border-radius: 14px;
      padding: 15px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    button:active {
      transform: scale(0.98);
    }

    .start-button {
      background: #333;
      color: white;
    }

    .pause-button {
      background: #e8e5df;
      color: #444;
    }

    .repeat-button {
      background: #f1efea;
      color: #555;
    }

    .next-button {
      background: #333;
      color: white;
    }

    .back-button {
      background: transparent;
      color: #999;
      font-size: 13px;
      padding: 10px;
    }

    /* =========================
       アドバイス
    ========================== */

    .tip {
      margin-top: 18px;
      padding: 14px;
      background: #faf9f6;
      border-radius: 12px;
      font-size: 13px;
      line-height: 1.7;
      color: #777;
      text-align: left;
    }

    /* =========================
       完了画面
    ========================== */

    .complete {
      text-align: center;
      padding: 50px 10px;
    }

    .complete-icon {
      font-size: 70px;
      margin-bottom: 15px;
    }

    .complete h2 {
      font-size: 30px;
      margin: 0 0 15px;
    }

    .complete p {
      color: #777;
      line-height: 1.8;
      margin-bottom: 30px;
    }

    .total-time {
      display: inline-block;
      background: #f3f1ec;
      padding: 12px 20px;
      border-radius: 999px;
      margin-bottom: 25px;
      font-size: 14px;
    }

    /* =========================
       スマホ
    ========================== */

    @media (max-width: 380px) {

      .app {
        padding: 18px 14px 30px;
      }

      .card {
        padding: 24px 17px;
      }

      .exercise-name {
        font-size: 23px;
      }

      .timer {
        font-size: 42px;
      }

      .rep-number {
        font-size: 50px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <header>
    <div class="app-title">TODAY'S WORKOUT</div>
    <h1>🌱 5分トレーニング</h1>
  </header>


  <!-- =========================
       トレーニング画面
  ========================== -->

  <div id="workoutScreen">

    <div class="progress-area">

      <div class="progress-text">
        <span id="progressText">1 / 7</span>
        <span id="progressPercent">14%</span>
      </div>

      <div class="progress-bar">
        <div
          class="progress-fill"
          id="progressFill">
        </div>
      </div>

    </div>


    <div class="card">

      <div class="step-label">
        EXERCISE
      </div>


      <div
        class="exercise-icon"
        id="exerciseIcon">
        🚶
      </div>


      <h2
        class="exercise-name"
        id="exerciseName">
        その場で足踏み
      </h2>


      <p
        class="exercise-description"
        id="exerciseDescription">
        背筋を軽く伸ばして、右足・左足と交互にその場で足踏み。
        腕も自然に振りましょう。
      </p>


      <div
        class="target"
        id="exerciseTarget">
        ⏱ 1分
      </div>


      <!-- =====================
           時間表示
      ====================== -->

      <div id="timerArea">

        <div class="timer-label">
          取り組み時間
        </div>

        <div
          class="timer"
          id="timer">
          00:00
        </div>

      </div>


      <!-- =====================
           回数表示
      ====================== -->

      <div
        class="rep-counter"
        id="repArea"
        style="display:none;">

        <div
          class="rep-number"
          id="repNumber">
          0
        </div>

        <div
          class="rep-target"
          id="repTarget">
          / 10回
        </div>

      </div>


      <div
        class="timer-status"
        id="timerStatus">
        準備ができたらスタート！
      </div>


      <!-- =====================
           回数カウントボタン
      ====================== -->

      <button
        class="count-button"
        id="countButton"
        onclick="countRep()"
        style="display:none;">
        ＋ 1回
      </button>


      <!-- =====================
           操作ボタン
      ====================== -->

      <div class="buttons">

        <button
          class="start-button"
          id="startButton"
          onclick="startTimer()">
          ▶ スタート
        </button>


        <button
          class="pause-button"
          id="pauseButton"
          onclick="togglePause()"
          style="display:none;">
          ⏸ 一時停止
        </button>


        <button
          class="repeat-button"
          id="repeatButton"
          onclick="resetExercise()"
          style="display:none;">
          🔄 もう一度やる
        </button>


        <button
          class="next-button"
          id="nextButton"
          onclick="nextExercise()"
          style="display:none;">
          次の種目へ →
        </button>


        <button
          class="back-button"
          id="backButton"
          onclick="previousExercise()"
          style="display:none;">
          ← 前の種目に戻る
        </button>

      </div>


      <div
        class="tip"
        id="exerciseTip">
        💡 無理に膝を高く上げなくてOK。
        「その場で歩く」くらいの感覚で大丈夫！
      </div>

    </div>

  </div>


  <!-- =========================
       完了画面
  ========================== -->

  <div
    id="completeScreen"
    style="display:none;">

    <div class="card complete">

      <div class="complete-icon">
        🎉
      </div>

      <h2>
        お疲れ様でした！
      </h2>

      <p>
        今日のトレーニング、<br>
        しっかり最後までできました！<br><br>
        まずは「やった自分」を褒めよう🌱
      </p>

      <div class="total-time">
        ⏱ 今日のトータル時間：
        <strong id="totalTime">
          00:00
        </strong>
      </div>

      <button
        class="start-button"
        onclick="restartWorkout()">
        🔄 もう一度やる
      </button>

    </div>

  </div>

</div>


<script>

  /* =========================
     トレーニングメニュー
     
     type:
       "time" = 時間制
       "reps" = 回数制
  ========================== */

  const exercises = [

    {
      type: "time",
      icon: "🚶",
      name: "その場で足踏み",
      description:
        "背筋を軽く伸ばして、右足・左足と交互にその場で足踏み。腕も自然に振りましょう。",
      target: "⏱ 1分",
      tip:
        "💡 無理に膝を高く上げなくてOK。「その場で歩く」くらいの感覚で大丈夫！",
      targetSeconds: 60
    },

    {
      type: "reps",
      icon: "🪑",
      name: "スクワット",
      description:
        "足を肩幅くらいに開き、お尻を後ろに引くようにゆっくり腰を下ろします。",
      target: "🔢 10回",
      tip:
        "💡 「椅子に座る」イメージで。最初は浅くしゃがむだけでもOK！",
      targetReps: 10
    },

    {
      type: "reps",
      icon: "🙌",
      name: "壁腕立て",
      description:
        "壁に両手をつき、肘を曲げて胸を壁に近づけ、壁を押して元に戻ります。",
      target: "🔢 10回",
      tip:
        "💡 体をなるべく一直線に。床でやる腕立て伏せよりずっと簡単です。",
      targetReps: 10
    },

    {
      type: "reps",
      icon: "🌉",
      name: "ヒップリフト",
      description:
        "仰向けになり膝を曲げます。お尻をキュッと締めながらゆっくり持ち上げましょう。",
      target: "🔢 10〜15回",
      tip:
        "💡 腰を反らすのではなく、お尻で持ち上げるイメージです。",
      targetReps: 10
    },

    {
      type: "reps",
      icon: "🦶",
      name: "かかと上げ",
      description:
        "まっすぐ立ち、両方のかかとをゆっくり上げて、ゆっくり下ろします。",
      target: "🔢 15〜20回",
      tip:
        "💡 ふらつく場合は、壁や机につかまってOK。反動をつけずにゆっくり！",
      targetReps: 15
    },

    {
      type: "time",
      icon: "🚶‍♀️",
      name: "その場で足踏み",
      description:
        "もう一度その場で足踏み。今度は少しだけ元気よく、腕もしっかり振りましょう。",
      target: "⏱ 1分",
      tip:
        "💡 「ちょっと心拍数が上がったな」くらいでOK。頑張りすぎなくて大丈夫！",
      targetSeconds: 60
    },

    {
      type: "time",
      icon: "🧘",
      name: "軽くストレッチ",
      description:
        "ふくらはぎ、太ももの前、胸・肩などをゆっくり伸ばして体を整えます。",
      target: "⏱ 1〜2分",
      tip:
        "💡 痛いところまで伸ばさず、「気持ちいい」と感じるところで止めましょう。",
      targetSeconds: 90
    }

  ];


  /* =========================
     状態
  ========================== */

  let currentExercise = 0;

  let seconds = 0;

  let reps = 0;

  let totalSeconds = 0;

  let timerInterval = null;

  let isRunning = false;

  let isPaused = false;


  /* =========================
     現在の種目
  ========================== */

  function getCurrentExercise() {
    return exercises[currentExercise];
  }


  /* =========================
     画面更新
  ========================== */

  function updateScreen() {

    const exercise =
      getCurrentExercise();


    document.getElementById("exerciseIcon").textContent =
      exercise.icon;

    document.getElementById("exerciseName").textContent =
      exercise.name;

    document.getElementById("exerciseDescription").textContent =
      exercise.description;

    document.getElementById("exerciseTarget").textContent =
      exercise.target;

    document.getElementById("exerciseTip").textContent =
      exercise.tip;


    /* 進捗 */

    document.getElementById("progressText").textContent =
      `${currentExercise + 1} / ${exercises.length}`;


    const percent =
      Math.round(
        ((currentExercise + 1) / exercises.length) * 100
      );


    document.getElementById("progressPercent").textContent =
      `${percent}%`;


    document.getElementById("progressFill").style.width =
      `${percent}%`;


    /* 種目タイプ */

    const timerArea =
      document.getElementById("timerArea");

    const repArea =
      document.getElementById("repArea");

    const countButton =
      document.getElementById("countButton");


    if (exercise.type === "time") {

      timerArea.style.display = "block";

      repArea.style.display = "none";

      countButton.style.display = "none";

    } else {

      timerArea.style.display = "block";

      repArea.style.display = "block";

      countButton.style.display =
        isRunning || isPaused
        ? "block"
        : "none";

      document.getElementById("repNumber").textContent =
        reps;

      document.getElementById("repTarget").textContent =
        `/ ${exercise.targetReps}回`;
    }


    updateTimerDisplay();

    updateButtons();
  }


  /* =========================
     ボタン表示
  ========================== */

  function updateButtons() {

    const exercise =
      getCurrentExercise();


    let targetReached = false;


    if (exercise.type === "time") {

      targetReached =
        seconds >= exercise.targetSeconds;

    } else {

      targetReached =
        reps >= exercise.targetReps;

    }


    const startButton =
      document.getElementById("startButton");

    const pauseButton =
      document.getElementById("pauseButton");

    const repeatButton =
      document.getElementById("repeatButton");

    const nextButton =
      document.getElementById("nextButton");

    const countButton =
      document.getElementById("countButton");


    /* スタート */

    startButton.style.display =
      (!isRunning && !isPaused && seconds === 0)
      ? "block"
      : "none";


    /* 一時停止 */

    pauseButton.style.display =
      (isRunning || isPaused)
      ? "block"
      : "none";


    pauseButton.textContent =
      isPaused
      ? "▶ 再開"
      : "⏸ 一時停止";


    /* 回数ボタン */

    if (exercise.type === "reps") {

      countButton.style.display =
        !targetReached && (isRunning || isPaused)
        ? "block"
        : "none";

      countButton.disabled =
        isPaused || targetReached;

    }


    /* 目標達成後だけ表示 */

    repeatButton.style.display =
      targetReached
      ? "block"
      : "none";


    nextButton.style.display =
      targetReached
      ? "block"
      : "none";


    /* 前へ */

    document.getElementById("backButton").style.display =
      currentExercise > 0
      ? "block"
      : "none";


    /* ステータス */

    const status =
      document.getElementById("timerStatus");


    if (targetReached) {

      status.textContent =
        "🎉 目標達成！";

      status.className =
        "timer-status complete";

    } else if (isPaused) {

      status.textContent =
        "⏸ 一時停止中";

      status.className =
        "timer-status";

    } else if (isRunning) {

      if (exercise.type === "time") {

        status.textContent =
          "そのまま続けよう！";

      } else {

        status.textContent =
          "フォームを意識して、ゆっくり！";
      }

      status.className =
        "timer-status";

    } else {

      status.textContent =
        "準備ができたらスタート！";

      status.className =
        "timer-status";
    }

  }


  /* =========================
     スタート
  ========================== */

  function startTimer() {

    if (isRunning) return;


    isRunning = true;

    isPaused = false;


    timerInterval =
      setInterval(() => {

        seconds++;

        totalSeconds++;

        updateTimerDisplay();

        updateButtons();

      }, 1000);


    updateScreen();
  }


  /* =========================
     一時停止・再開
  ========================== */

  function togglePause() {

    if (isRunning) {

      clearInterval(timerInterval);

      timerInterval = null;

      isRunning = false;

      isPaused = true;

    } else if (isPaused) {

      isPaused = false;

      isRunning = true;


      timerInterval =
        setInterval(() => {

          seconds++;

          totalSeconds++;

          updateTimerDisplay();

          updateButtons();

        }, 1000);
    }


    updateScreen();
  }


  /* =========================
     回数カウント
  ========================== */

  function countRep() {

    const exercise =
      getCurrentExercise();


    if (exercise.type !== "reps") {
      return;
    }


    if (!isRunning || isPaused) {
      return;
    }


    if (reps >= exercise.targetReps) {
      return;
    }


    reps++;


    document.getElementById("repNumber").textContent =
      reps;


    updateButtons();


    /* 目標達成 */

    if (reps >= exercise.targetReps) {

      /* タイマーは止めず、
         その種目を終えた時間まで計測 */

      document.getElementById("timerStatus").textContent =
        "🎉 目標達成！";

      document.getElementById("timerStatus").className =
        "timer-status complete";
    }

  }


  /* =========================
     種目をリセット
  ========================== */

  function resetExercise() {

    clearInterval(timerInterval);

    timerInterval = null;

    isRunning = false;

    isPaused = false;

    seconds = 0;

    reps = 0;


    updateScreen();
  }


  /* =========================
     次の種目
  ========================== */

  function nextExercise() {

    const exercise =
      getCurrentExercise();


    let targetReached;


    if (exercise.type === "time") {

      targetReached =
        seconds >= exercise.targetSeconds;

    } else {

      targetReached =
        reps >= exercise.targetReps;

    }


    if (!targetReached) {
      return;
    }


    clearInterval(timerInterval);

    timerInterval = null;

    isRunning = false;

    isPaused = false;


    if (currentExercise === exercises.length - 1) {

      showComplete();

      return;
    }


    currentExercise++;

    seconds = 0;

    reps = 0;


    updateScreen();
  }


  /* =========================
     前の種目
  ========================== */

  function previousExercise() {

    clearInterval(timerInterval);

    timerInterval = null;

    isRunning = false;

    isPaused = false;

    currentExercise =
      Math.max(0, currentExercise - 1);

    seconds = 0;

    reps = 0;


    updateScreen();
  }


  /* =========================
     タイマー表示
  ========================== */

  function updateTimerDisplay() {

    const minutes =
      Math.floor(seconds / 60);


    const remainingSeconds =
      seconds % 60;


    document.getElementById("timer").textContent =
      `${String(minutes).padStart(2, "0")}:${String(remainingSeconds).padStart(2, "0")}`;
  }


  /* =========================
     完了画面
  ========================== */

  function showComplete() {

    clearInterval(timerInterval);

    timerInterval = null;

    isRunning = false;

    isPaused = false;


    document.getElementById("workoutScreen").style.display =
      "none";


    document.getElementById("completeScreen").style.display =
      "block";


    document.getElementById("totalTime").textContent =
      formatTime(totalSeconds);
  }


  /* =========================
     最初から
  ========================== */

  function restartWorkout() {

    clearInterval(timerInterval);

    timerInterval = null;

    isRunning = false;

    isPaused = false;

    currentExercise = 0;

    seconds = 0;

    reps = 0;

    totalSeconds = 0;


    document.getElementById("workoutScreen").style.display =
      "block";


    document.getElementById("completeScreen").style.display =
      "none";


    updateScreen();
  }


  /* =========================
     時間フォーマット
  ========================== */

  function formatTime(totalSeconds) {

    const minutes =
      Math.floor(totalSeconds / 60);


    const seconds =
      totalSeconds % 60;


    return `${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}`;
  }


  /* =========================
     初期表示
  ========================== */

  updateScreen();

</script>

</body>
</html>
```
